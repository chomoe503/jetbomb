<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>飛機投彈物理模擬</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: wide screens put the stage on the left and a 344px control column on the right; phones stack stage, transport, then controls. */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --surface-2:#F4F7FA; --ink:#13202E; --ink-2:#506274; --line:#D2DBE4;
  --accent:#13202E; --on-accent:#FFFFFF; --on-drop:#FFFFFF; --trail:#1D63F0;
  --c-const:#2563D6; --c-accel:#D9432B; --c-decel:#12875B;
  --chip-bg:rgba(255,255,255,.88); --chip-ink:#13202E;
  --sky-top:#7FBDEF; --sky-bot:#E4F3FD; --sky-ink:rgba(19,32,46,.62); --grid:rgba(255,255,255,.45);
  --grass:#5AA848; --soil:#7B5B3D; --ga:#6CB45A; --gb:#62A950; --ln-b:#E08400;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D141B; --surface:#152029; --surface-2:#1A2733; --ink:#E6EDF4; --ink-2:#9BAEC0; --line:#2A3947;
    --accent:#E6EDF4; --on-accent:#0D141B; --on-drop:#1B0D09; --trail:#6FA8FF;
    --c-const:#6C9CFF; --c-accel:#FF7D66; --c-decel:#3FCB91;
    --chip-bg:rgba(13,20,27,.78); --chip-ink:#E6EDF4;
    --sky-top:#0E2136; --sky-bot:#2A4C70; --sky-ink:rgba(255,255,255,.6); --grid:rgba(255,255,255,.14);
    --grass:#2F6B3A; --soil:#4A3826; --ga:#2F6D3B; --gb:#2A6235; --ln-b:#FFB347;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#152029; --surface-2:#1A2733; --ink:#E6EDF4; --ink-2:#9BAEC0; --line:#2A3947;
  --accent:#E6EDF4; --on-accent:#0D141B; --on-drop:#1B0D09; --trail:#6FA8FF;
  --c-const:#6C9CFF; --c-accel:#FF7D66; --c-decel:#3FCB91;
  --chip-bg:rgba(13,20,27,.78); --chip-ink:#E6EDF4;
  --sky-top:#0E2136; --sky-bot:#2A4C70; --sky-ink:rgba(255,255,255,.6); --grid:rgba(255,255,255,.14);
  --grass:#2F6B3A; --soil:#4A3826; --ga:#2F6D3B; --gb:#2A6235; --ln-b:#FFB347;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-ui); font-size:15px; line-height:1.6;
  padding-block:18px 44px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
button,input,output{font:inherit;color:inherit}
.mono{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.app{max-width:1240px;margin:0 auto}

.head{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
h1{margin:0;font-size:clamp(22px,4.8vw,30px);font-weight:800;line-height:1.25;text-wrap:balance}
.sub{margin:0;color:var(--ink-2);font-size:14px;max-width:64ch}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:980px){
  .layout{grid-template-columns:minmax(0,1fr) 344px;gap:20px;align-items:start}
}
.stage-col{display:flex;flex-direction:column;gap:10px;min-width:0}

.tabs{display:flex;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.tab{flex:1;min-width:0;border:0;background:transparent;color:var(--ink-2);font-weight:700;font-size:14px;padding:9px 6px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 3px rgba(0,0,0,.12)}
.tab:focus-visible,.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.stage{position:relative;width:100%;aspect-ratio:1/1;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--sky-bot);isolation:isolate}
@media (min-width:640px){.stage{aspect-ratio:16/10;max-height:min(68svh,660px)}}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#c2d{touch-action:pan-y}
.stage[data-view="ground"] #c3d{display:none}
.stage:not([data-view="ground"]) #c2d{display:none}
.stage:not([data-view="belly"]) .only-belly{display:none}
.stage:not([data-view="model"]) .only-model{display:none}

.chip{position:absolute;z-index:3;padding:3px 9px;border-radius:999px;background:var(--chip-bg);color:var(--chip-ink);font-size:12px;line-height:1.5;pointer-events:none;white-space:nowrap}
.tl{position:absolute;z-index:3;left:10px;top:10px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;pointer-events:none}
.tl .chip{position:static}
.chip.bc{left:50%;bottom:10px;transform:translateX(-50%)}
#hint{transition:opacity .4s}
.stage[data-view="ground"] #hint{left:auto;right:10px;top:54px;bottom:auto;transform:none}
.stage[data-view="belly"] #hint{display:none}
.stage:not([data-view="ground"]) .only-ground{display:none}
#c2d{cursor:grab;touch-action:pan-y}
#c2d.dragging{cursor:grabbing}
.seg.zoom button{min-width:34px;min-height:30px;padding:3px 8px;font-size:16px;line-height:1}
.seg.zoom #zFit{font-size:12px;min-width:50px}
.chip.tr{right:10px;top:10px}
.seg{position:absolute;z-index:4;right:10px;top:10px;display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--chip-bg)}
.seg button{border:0;background:transparent;color:var(--chip-ink);font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.vignette{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(0,0,0,.5) 100%)}
.reticle{position:absolute;z-index:2;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border:1.5px solid rgba(255,255,255,.9);border-radius:50%;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.25)}
.reticle::before,.reticle::after{content:"";position:absolute;background:rgba(255,255,255,.9)}
.reticle::before{left:50%;top:-9px;bottom:-9px;width:1.5px;margin-left:-.75px}
.reticle::after{top:50%;left:-9px;right:-9px;height:1.5px;margin-top:-.75px}
.nogl[hidden]{display:none}
.nogl{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--surface-2);color:var(--ink-2);font-size:14px}

.transport{display:grid;grid-template-columns:1.2fr 1.1fr auto auto;gap:8px}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.drop{background:var(--c-accel);border-color:var(--c-accel);color:var(--on-drop)}
.btn:disabled{cursor:not-allowed}
.btn.drop:disabled{background:var(--surface);border-color:var(--line);color:var(--ink-2);opacity:.65}
.btn:active{transform:translateY(1px)}
.tip{grid-column:1/-1;margin:0;font-size:13px;line-height:1.5;color:var(--ink-2);min-height:3em}
.scrub{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.scrub input{flex:1;min-width:0;accent-color:var(--accent);height:28px}
.scrub output{min-width:64px;text-align:right;color:var(--ink-2);font-size:13px}

.panel{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.sec{display:flex;flex-direction:column;gap:10px;padding:14px}
.sec+.sec{border-top:1px solid var(--line)}
.sec h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--ink-2)}

.modes{display:flex;flex-direction:column;gap:8px}
.mode{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;min-width:0}
.mode[data-mode="constant"]{--mc:var(--c-const)}
.mode[data-mode="accel"]{--mc:var(--c-accel)}
.mode[data-mode="decel"]{--mc:var(--c-decel)}
.mode input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.mode.on{border-color:var(--mc);box-shadow:0 0 0 1px var(--mc);background:var(--surface-2)}
.mode:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.mode-body{display:flex;flex-direction:column;min-width:0}
.mode-name{font-weight:700;font-size:15px}
.mode-nums{font-size:12px;color:var(--ink-2)}
.mode-tag{flex:none;padding:1px 9px;border:1px solid var(--mc);border-radius:6px;color:var(--mc);font-size:13px;font-weight:600}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.stat.wide{grid-column:1/-1}
.params{display:flex;flex-direction:column;gap:4px}
.amag{display:grid;grid-template-columns:5.4em minmax(0,1fr) auto;align-items:center;gap:10px;font-size:14px;font-weight:500}
.amag input{accent-color:var(--accent);min-width:0;height:28px}
.amag output{min-width:72px;text-align:right;color:var(--ink-2);font-size:13px}
.amag.off{opacity:.5}
.stat span{display:block;font-size:12px;color:var(--ink-2);line-height:1.4}
.stat b{display:block;font:600 17px/1.5 var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:pointer;font-size:14px;font-weight:500}
.sw small{display:block;font-size:12px;color:var(--ink-2);font-weight:400}
.sw input{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:42px;height:24px;margin:0;border-radius:12px;background:var(--line);cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .15s}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(18px);background:var(--on-accent)}
.sw input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.explain{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px 14px}
.explain summary{cursor:pointer;padding:12px 0;font-weight:800;font-size:16px;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px}
.explain summary::-webkit-details-marker{display:none}
.explain summary::after{content:"+";font:500 20px var(--font-num);color:var(--ink-2)}
.explain[open] summary::after{content:"–"}
.obs-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:820px){.obs-grid{grid-template-columns:1fr 1fr;gap:16px}}
.obs{min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.obs.cur{border-color:var(--ink-2)}
.obs h3{margin:0 0 4px;font-size:14px;font-weight:700}
.obs p{margin:0;font-size:15px;max-width:68ch}
.foot{margin:12px 0 0;font-size:12.5px;color:var(--ink-2);max-width:90ch}
.foot b{font-family:var(--font-num);font-weight:500;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="head">
    <h1 id="h1">飛機投彈物理模擬</h1>
    <p class="sub" id="sub">比較等速、加速、減速飛行時，連續投下的炸彈在地面上和機上看起來有什麼不同。</p>
  </header>

  <div class="layout">
    <section class="stage-col" aria-label="模擬畫面">
      <div class="tabs" role="tablist" aria-label="視角">
        <button class="tab" role="tab" data-view="ground" aria-selected="true">地面視角</button>
        <button class="tab" role="tab" data-view="belly" aria-selected="false">機上視角</button>
        <button class="tab" role="tab" data-view="model" aria-selected="false">3D 模型</button>
      </div>

      <div class="stage" id="stage" data-view="ground">
        <canvas id="c2d" role="img" aria-label="地面側視圖：飛機與炸彈軌跡"></canvas>
        <canvas id="c3d" role="img" aria-label="3D 畫面"></canvas>
        <div class="vignette only-belly"></div>
        <div class="reticle only-belly"></div>
        <div class="tl"><span class="chip mono" id="hud">t 0.00 s · 0.0 m/s</span><span class="chip" id="caption">地面上的觀察者</span></div>
        <span class="chip tr only-belly" id="fwd">機頭 ↑</span>
        <div class="seg only-model" id="camsw">
          <button type="button" data-cam="free" class="on">自由環繞</button>
          <button type="button" data-cam="follow">跟隨飛機</button>
        </div>
        <span class="chip bc" id="hint">拖曳平移 · 滾輪或雙指縮放</span>
        <div class="seg zoom only-ground" role="group" aria-label="縮放">
          <button type="button" id="zOut" aria-label="縮小">−</button>
          <button type="button" id="zIn" aria-label="放大">＋</button>
          <button type="button" id="zFit">全景</button>
        </div>
        <div class="nogl" id="nogl" hidden>這個裝置無法顯示 3D 畫面，請改用「地面視角」。</div>
      </div>

      <div class="transport">
        <button class="btn primary" id="play" type="button">開始</button>
        <button class="btn drop" id="drop" type="button" disabled>投彈</button>
        <button class="btn" id="reset" type="button">重置</button>
        <button class="btn mono" id="speed" type="button" aria-label="播放速度">1×</button>
        <p class="tip" id="tip"></p>
        <div class="scrub">
          <input id="scrub" type="range" min="0" max="7.44" step="0.01" value="5.8" aria-label="時間軸">
          <output id="tout" class="mono" for="scrub">5.80 s</output>
        </div>
      </div>
    </section>

    <aside class="panel" aria-label="控制面板">
      <div class="sec">
        <h2>飛行設定</h2>
        <div class="modes" role="radiogroup" aria-label="飛行模式">
          <label class="mode on" data-mode="constant"><input type="radio" name="mode" value="constant" checked>
            <span class="mode-body"><span class="mode-name">等速飛行</span><span class="mode-nums mono" data-nums></span></span><span class="mode-tag mono">a = 0</span></label>
          <label class="mode" data-mode="accel"><input type="radio" name="mode" value="accel">
            <span class="mode-body"><span class="mode-name">加速飛行</span><span class="mode-nums mono" data-nums></span></span><span class="mode-tag mono">a &gt; 0</span></label>
          <label class="mode" data-mode="decel"><input type="radio" name="mode" value="decel">
            <span class="mode-body"><span class="mode-name">減速飛行</span><span class="mode-nums mono" data-nums></span></span><span class="mode-tag mono">a &lt; 0</span></label>
        </div>
        <div class="params">
          <label class="amag" id="aMagWrap"><span>加速度大小</span><input id="aMag" type="range" min="1" max="20" step="1" value="10" aria-label="加速度大小"><output id="aOut" class="mono" for="aMag">10.0 m/s²</output></label>
          <label class="amag"><span>飛行高度</span><input id="alt" type="range" min="20" max="200" step="10" value="80" aria-label="飛行高度"><output id="altOut" class="mono" for="alt">80 m</output></label>
          <label class="amag"><span>炸彈數量</span><input id="nb" type="range" min="4" max="30" step="1" value="12" aria-label="炸彈數量"><output id="nbOut" class="mono" for="nb">12 顆</output></label>
          <label class="amag"><span>投彈間隔</span><input id="gap" type="range" min="0.3" max="1.2" step="0.1" value="0.5" aria-label="投彈間隔"><output id="gapOut" class="mono" for="gap">0.5 s</output></label>
        </div>
      </div>

      <div class="sec">
        <h2>即時數據</h2>
        <div class="stats">
          <div class="stat"><span id="lbN">已投下炸彈</span><b id="sN">0 / 12</b></div>
          <div class="stat"><span id="lbV">飛機速度</span><b id="sV">0.0 m/s</b></div>
          <div class="stat"><span id="lbDx">空中最早那顆：偏離正下方</span><b id="sDx">—</b></div>
          <div class="stat"><span id="lbY">空中最早那顆：離地高度</span><b id="sY">—</b></div>
          <div class="stat wide"><span>落點間距（最早 → 最新）</span><b id="sGap">—</b></div>
        </div>
      </div>

      <div class="sec">
        <h2>顯示選項</h2>
        <label class="sw"><span>飛機正下方的鉛垂線</span><input type="checkbox" id="optV" checked></label>
        <label class="sw"><span>同一時刻的炸彈連線<small>空中所有炸彈都排在這條線上</small></span><input type="checkbox" id="optB" checked></label>
        <label class="sw"><span>小雞下蛋模式</span><input type="checkbox" id="optChick"></label>
      </div>
    </aside>
  </div>

  <details class="explain" id="explain" open>
    <summary id="exTitle">物理原理：等速飛行</summary>
    <div class="obs-grid">
      <div class="obs" id="obsG"><h3>地面上的觀察者</h3><p id="exG"></p></div>
      <div class="obs" id="obsP"><h3 id="exPT">飛機上的人（朝正下方看）</h3><p id="exP"></p></div>
    </div>
    <p class="foot" id="exFoot"></p>
  </details>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineSegmentsGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineMaterial.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineSegments2.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/Line2.js"></script>
<script>
(function(){

/* ============ 物理設定（SI 單位）============ */
const G=9.8, DROP_DY=1.7, FADE=0.8, STEP=0.1;
const V_REF=20, T_WAIT=5, PRE0=1.5, MAXB=30, NS_MAX=72;
let ALT=80, A_MAG=10, NB=12, GAP=0.5, Y0=0, S_FALL=0, NS=2;     // 高度、加速度大小、炸彈數、投彈間隔都可由滑桿調整
const MODES={
  constant:{key:'constant',name:'等速飛行',v0:V_REF,a:0},
  accel:{key:'accel',name:'加速飛行',v0:0,a:0},
  decel:{key:'decel',name:'減速飛行',v0:0,a:0}
};
function setupParams(){
  Y0=ALT-DROP_DY; S_FALL=Math.sqrt(2*Y0/G); NS=Math.min(NS_MAX,Math.floor(S_FALL/STEP)+2);
  MODES.accel.a=A_MAG;  MODES.accel.v0=Math.max(V_REF-2*A_MAG,2);
  /* 減速模式的初速要夠大：最晚在 T_WAIT 秒內開始投彈，投完最後一顆時，飛機的速度仍大於 |a|·下落時間，
     這樣後投的炸彈才不會落到前面去，飛機也不會在投完前就停住 */
  MODES.decel.a=-A_MAG; MODES.decel.v0=Math.ceil(Math.max(V_REF+2*A_MAG,A_MAG*(T_WAIT+(NB-1)*GAP+S_FALL+.5)));
}
const st={mode:'constant',chick:false,view:'ground',cam:'free',t:0,run:'idle',speed:1,showV:true,showB:true,dirty:true,
  taus:[],live:false,preview:true,dropping:false,nextDrop:0,tReach:0,msg:'',snap:true,vc:0,vS:2,userCam:false,zoom:1,zoomT:1,follow:true,fit:false,off:0,vcT:null,oy:0};
const M=()=>MODES[st.mode];

function planeAt(t){
  const m=M(); let tt=t;
  if(m.a<0) tt=Math.min(t,-m.v0/m.a);          // 減速到 0 就停住，不倒退
  return {x:m.v0*tt+.5*m.a*tt*tt, v:m.v0+m.a*tt};
}
let REL=[];                                      // 每顆炸彈離機時的狀態（由 st.taus 推出）
const relOf=tau=>{ const p=planeAt(tau); return {tau,x0:p.x,vx:p.v}; };
const syncRel=()=>{ REL=st.taus.map(relOf); };
function bombAt(i,t){
  const r=REL[i]; if(!r) return null; const s=t-r.tau; if(s<0) return null;
  const ss=Math.min(s,S_FALL);
  return {i,s,ss,landed:s>=S_FALL,age:s-S_FALL,x0:r.x0,vx:r.vx,x:r.x0+r.vx*ss,y:Y0-.5*G*ss*ss,vy:-G*ss};
}
const relPoint=(i,s)=>{                           // 炸彈相對飛機的位置（機上參考系）
  const r=REL[i]; return {x:r.vx*s+r.x0-planeAt(r.tau+s).x, y:(Y0-.5*G*s*s)-ALT};
};
const tEnd=()=>st.taus.length?st.taus[st.taus.length-1]+S_FALL+FADE:0;
const previewTaus=()=>Array.from({length:NB},(_,i)=>PRE0+i*GAP);
const previewT=()=>PRE0+(NB-1)*GAP+.7*S_FALL;      // 預覽停在大部分炸彈都已落地的時刻，落點間距一眼就看得到
const scrubMax=()=>Math.max(.01,st.live?st.tReach:(st.taus.length?tEnd():st.tReach));
const niceStep=x=>{ const p=Math.pow(10,Math.floor(Math.log10(x))),f=x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; };
function eventRange(t){                           // 畫面要涵蓋的水平範圍：飛機、每顆炸彈的離機點與（預計的）落點
  const P=planeAt(t); let lo=P.x,hi=P.x;
  for(let i=0;i<REL.length;i++){ const r=REL[i]; if(t<r.tau) continue; const xl=r.x0+r.vx*S_FALL;
    lo=Math.min(lo,r.x0,xl); hi=Math.max(hi,r.x0,xl); }
  return [lo,hi];
}

/* ============ 尺寸 / 色票 ============ */
const imgChick=new Image(), imgEgg=new Image();
imgChick.onload=imgEgg.onload=()=>{ st.dirty=true; };
imgChick.src=CHICK_SRC; imgEgg.src=EGG_SRC;
const c2d=$('c2d'), c3d=$('c3d'), stage=$('stage'), x2d=c2d.getContext('2d');
let W=1,Hh=1,dpr=1; const C={};
const cs=getComputedStyle(document.documentElement);
function readTokens(){
  ['sky-top','sky-bot','sky-ink','grid','grass','soil','ga','gb','ln-b','c-const','c-accel','c-decel','trail','chip-bg','chip-ink'].forEach(n=>{C[n]=cs.getPropertyValue('--'+n).trim();});
  if(R&&R.ok) applyTheme3D();
  st.dirty=true;
}
const modeColor=()=>C[{constant:'c-const',accel:'c-accel',decel:'c-decel'}[st.mode]];

function resize(){
  const r=stage.getBoundingClientRect();
  W=Math.max(1,Math.round(r.width)); Hh=Math.max(1,Math.round(r.height));
  dpr=Math.min(window.devicePixelRatio||1,2);
  c2d.width=Math.round(W*dpr); c2d.height=Math.round(Hh*dpr);
  if(R&&R.ok){
    R.renderer.setPixelRatio(dpr); R.renderer.setSize(W,Hh,false);
    R.camFree.aspect=R.camBelly.aspect=W/Hh; R.camFree.updateProjectionMatrix(); R.camBelly.updateProjectionMatrix();
    if(FAT){ R.matGround.resolution.set(W,Hh); R.matRel.resolution.set(W,Hh); }
  }
  st.snap=true; st.dirty=true;
  HF=fullH(); if(st.fit) fitAll(true);
  requestAnimationFrame(layoutStage);
}

/* ============ 2D：地面側視 ============ */
function drawPlane2D(ctx,len,running,tm){
  const u=len/100; ctx.save(); ctx.scale(u,u); ctx.lineJoin='round'; ctx.lineWidth=1.5/u;
  const m=M();
  if(running){                                    // 噴焰：加速長、減速短
    const fl=m.a>0?26+Math.random()*12:(m.a<0?6+Math.random()*4:15+Math.random()*7);
    ctx.fillStyle=m.a>0?'#ff5a2a':(m.a<0?'#4aa3ff':'#ffb020');
    ctx.beginPath(); ctx.moveTo(-54,-3); ctx.lineTo(-54-fl,0); ctx.lineTo(-54,4); ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle='#5B6C7D';
  ctx.fillStyle='#BCC9D6';                        // 尾翼
  ctx.beginPath(); ctx.moveTo(-44,-6); ctx.lineTo(-57,-31); ctx.lineTo(-37,-31); ctx.lineTo(-24,-8); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#E7EDF3';                        // 機身
  ctx.beginPath(); ctx.moveTo(-52,-5); ctx.bezierCurveTo(-32,-12,10,-13,30,-8); ctx.bezierCurveTo(42,-5,50,-2,53,1);
  ctx.bezierCurveTo(46,6,30,10,8,10); ctx.bezierCurveTo(-18,10,-38,6,-52,1); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#F8FAFC';                        // 機翼
  ctx.beginPath(); ctx.moveTo(-6,2); ctx.lineTo(-26,27); ctx.lineTo(-2,27); ctx.lineTo(17,3); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#4DB2F0';                        // 座艙
  ctx.beginPath(); ctx.ellipse(24,-6,11,5,-.12,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawChick2D(ctx,len,running,tm,dropPx){
  if(!imgChick.complete||!imgChick.naturalWidth) return;
  const w=len*1.15, h=w*imgChick.naturalHeight/imgChick.naturalWidth;
  if(running&&M().a>0){ ctx.save(); ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.beginPath();
    [[-.62,-.3],[-.55,0],[-.6,.28]].forEach(([dx,dy])=>{ ctx.moveTo(w*dx,h*dy); ctx.lineTo(w*(dx-.22),h*dy); }); ctx.stroke(); ctx.restore(); }
  ctx.save(); ctx.translate(0,dropPx-h*.9);                          // 身體底部對齊蛋的離機點
  if(running) ctx.rotate(Math.sin(tm*14)*.035);
  ctx.drawImage(imgChick,-w/2,0,w,h); ctx.restore();
}
/* 地面視角：固定的等比例畫面（不壓縮、不變形）。預設跟著飛機走；想看更廣就縮放，拖曳可以平移 */
const S_MIN=.02, S_MAX=40, TOPM=78;
function geo2D(){
  const gb=Math.max(52,Math.min(80,Hh*.18)), gY=Hh-gb, Hs=Math.max(40,gY-TOPM);
  return {gb,gY,Hs,Sv:Math.max(S_MIN,Hs/ALT)};
}
const biasOf=()=>M().a>0?.72:M().a<0?.28:.5;          // 飛機在畫面橫向的位置：加速時炸彈留在後面、減速時炸彈跑到前面，各留出空間
let HF=390;                                            // 舞台「滿版」時的高度（手機是正方形）；預設比例都以它為準
function fullH(){
  const w=stage.getBoundingClientRect().width||390;
  return (window.matchMedia&&matchMedia('(min-width:640px)').matches)?Math.min(w*.625,window.innerHeight*.68,660):w;
}
function baseScale(){                                   // 預設比例：剛好把整趟預計的飛行（飛機、炸彈、全部落點）橫向放進畫面。只跟設定有關，飛行中不會變
  const gb=Math.max(52,Math.min(80,HF*.18)), Sv=Math.max(S_MIN,(HF-gb-TOPM)/ALT);
  const r=rangeOf(previewTaus().map(relOf),previewT()), span=Math.max(r[1]-r[0],20);
  return Math.max(S_MIN,Math.min(Sv,Math.max(60,W-70)/span));
}
function groundH(){                                     // 地面視角的舞台高度：剛好放得下天空到地面，不留一大片空白（比例不變形）
  const c=TOPM+ALT*baseScale();
  return Math.round(Math.min(HF,Math.max(TOPM+52+80,c+72,(c+20)/.82)));
}
function layoutStage(){
  HF=fullH();
  const h=st.view==='ground'?groundH():0, want=(h&&h<HF-1)?h+'px':'';
  if(stage.style.height!==want) stage.style.height=want;
}
const clampZ=(z,base)=>Math.min(S_MAX/base,Math.max(S_MIN/base,z));
function syncZoomBtn(){ const b=$('zFit'); if(!b) return; b.textContent=st.follow?'全景':'跟隨'; b.setAttribute('aria-label',st.follow?'縮小到看見全部':'回到跟隨飛機'); }
function zoomBtn(f){ st.fit=false; const base=baseScale(geo2D()); st.zoomT=clampZ(st.zoomT*f,base); st.dirty=true; }
function zoomAt(f,ax){                                  // 滾輪／雙指：立刻縮放；跟隨時繞著飛機，自由時繞著手指或游標

  const k=M().a/G;
  R.bLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints([V3(0,Y0,0),V3(-k*Y0,0,0)]),new THREE.LineBasicMaterial({color:new THREE.Color(C['ln-b'])})); R.bLine.frustumCulled=false; R.scene.add(R.bLine);

}
/* 自由環繞：在使用者還沒動手之前，自動取景，讓飛機與炸彈都在畫面裡 */
function frameFree(snap){
  const c=R.controls, cam=R.camFree, r=eventRange(st.t), asp=W/Hh;
  const Wd=(r[1]-r[0])+ALT*.6+40;
  const Dt=Math.max(Wd/(.768*asp)*1.3,(ALT*1.35+16)/.768);
  const tx=(r[0]+r[1])/2+ALT*.04, ty=ALT*.36;
  if(snap){ const d=V3(-.32,.15,.93).normalize(); c.target.set(tx,ty,0); cam.position.copy(c.target).addScaledVector(d,Dt); c.update(); return; }
  const k=1-Math.exp(-Math.min(frameDt,.1)*4.5);
  const off=cam.position.clone().sub(c.target), D=off.length(), dir=off.divideScalar(D);
  const nx=c.target.x+(tx-c.target.x)*k, ny=c.target.y+(ty-c.target.y)*k, nD=D+(Dt-D)*k;
  if(Math.abs(nx-c.target.x)<.01&&Math.abs(ny-c.target.y)<.01&&Math.abs(nD-D)<.02) return;
  c.target.set(nx,ny,0); cam.position.copy(c.target).addScaledVector(dir,nD); c.update();
}
function setCam(kind){
  st.cam=kind; document.querySelectorAll('#camsw button').forEach(b=>b.classList.toggle('on',b.dataset.cam===kind));
  if(!R||!R.ok) return;
  const c=R.controls, cam=R.camFree;
  if(kind==='free'){ st.userCam=false; frameFree(true); }
  else { const P=planeAt(st.t), d=Math.max(ALT,40); c.target.set(P.x+.1*ALT,.4*ALT,0); cam.position.set(c.target.x-.8*d,c.target.y+.2*d,2.04*d); R.lastFollowT=st.t; c.update(); }
  st.dirty=true;
}
function updateLabels(r){
  const span=Math.max(r[1]-r[0],ALT), a=r[0]-span*.35, b=r[1]+span*.35;
  const step=niceStep((b-a)/8), k0=Math.ceil(a/step), key=step+'|'+k0+'|'+ALT;
  if(R.labKey===key) return; R.labKey=key;
  const f=Math.max(1,ALT/75,step/70);
  R.labels.forEach((sp,n)=>{ const x=(k0+n)*step;
    if(x>b){ sp.visible=false; return; }
    sp.material.map=labelTex(x+' m'); sp.scale.set(10*f,5*f,1); sp.position.set(x,2.2*f,16*f); sp.visible=true; });
}
function render3D(){
  const belly=st.view==='belly', t=st.t, P=planeAt(t), run=st.run==='running';
  let mk=Math.max(1,ALT/60);                       // 離鏡頭越遠，飛機/小雞/炸彈放大一些，才看得清楚
  if(!belly) mk=Math.min(5,Math.max(mk,R.camFree.position.distanceTo(R.controls.target)/170));
  { const D=belly?ALT*2:R.camFree.position.distanceTo(R.controls.target), fn=Math.max(320,ALT*3.2,D*1.6); R.scene.fog.near=fn; R.scene.fog.far=fn*3.4; }
  R.mk=mk; R.plane.g.scale.setScalar(mk); R.chick.g.scale.set(7.6*mk,6.54*mk,1);
  const X1=V3(1,0,0);
  R.plane.g.visible=!belly&&!st.chick; R.chick.g.visible=!belly&&st.chick;
  R.plane.g.position.set(P.x,ALT,0); R.chick.g.position.set(P.x,ALT+.9*mk,0);
  const m=M(); R.plane.flame.visible=run; R.plane.flame.scale.x=(m.a>0?3.2:(m.a<0?.9:1.8))*(1+(run?Math.random()*.35:0));
  for(let i=0;i<MAXB;i++){
    const b=i<REL.length?bombAt(i,t):null, air=!!b&&!b.landed, landed=!!b&&b.landed;
    const mesh=st.chick?R.egg[i]:R.bomb[i], other=st.chick?R.bomb[i]:R.egg[i];
    other.visible=false; mesh.visible=air;
    if(air){ mesh.position.set(b.x,b.y,0); const sc=belly?(.3+.045*(ALT+2-b.y)):1.7*mk; mesh.scale.setScalar(st.chick?(belly?sc*.7:1.5*mk):sc);
      const v=V3(b.vx,b.vy,0); if(v.lengthSq()>1e-8) mesh.quaternion.setFromUnitVectors(X1,v.normalize()); }
    const cr=R.crater[i]; cr.visible=landed; if(landed){ cr.position.x=b.x; cr.scale.setScalar(mk); }
    const fl=R.flash[i], fa=landed&&b.age<FADE; fl.visible=fa;
    if(fa){ const f=b.age/FADE; fl.material.color.setHex(st.chick?0xfff2a8:0xff8a2a); fl.position.set(b.x,.5,0); fl.scale.setScalar((1+f*5.5)*mk); fl.material.opacity=.9*(1-f); }
    const cnt=b?Math.min(Math.floor(b.ss/STEP)+1,NS-1)+(landed?1:0):0;

  R.vLine.visible=st.showV&&!belly; R.vLine.position.x=P.x;
  R.bLine.visible=st.showB&&REL.length>0; R.bLine.position.x=P.x;
  if(belly){ if(R.labKey!=='hide'){ R.labels.forEach(sp=>{sp.visible=false;}); R.labKey='hide'; } }   // 機上視角不顯示地面標尺
  else updateLabels(eventRange(t));

    cam=R.camBelly; cam.position.set(P.x,ALT+2,0); cam.up.set(1,0,0); cam.lookAt(P.x,0,0);

  } else {
    cam=R.camFree;
    if(st.cam==='follow'){ if(R.lastFollowT!==t){ const nt=V3(P.x+.1*ALT,.4*ALT,0); const d=nt.clone().sub(R.controls.target); cam.position.add(d); R.controls.target.copy(nt); R.controls.update(); R.lastFollowT=t; } }
    else if(!st.userCam) frameFree(false);
    R.ground.position.set(Math.round(R.controls.target.x/20)*20,0,0);
    /* 小雞要面向飛行方向：從機身另一側看時（鏡頭右方向和 +x 反向）就把圖片左右翻過來 */
    cam.updateMatrixWorld(); const rx=cam.matrixWorld.elements[0];
    if(rx<-.03) R.flip=true; else if(rx>.03) R.flip=false;
    const tx=R.chick.g.material.map; tx.repeat.x=R.flip?-1:1; tx.offset.x=R.flip?1:0;
  }
  R.renderer.render(R.scene,cam);
}

/* ============ UI ============ */

function statusText(){

function syncButtons(){

function updateReadouts(){

function explain(){

function showHint(){

/* ============ 飛行流程 ============ */
function resetToPreview(){                        // 回到預覽：照目前的設定先排好一排炸彈給你看
  st.live=false; st.dropping=false; st.preview=true; st.run='idle'; st.msg='';
  st.taus=previewTaus(); syncRel(); st.t=previewT(); st.tReach=st.t; st.snap=true;
  fitAll(true);                                   // 預覽先看整體：全部落點一次放進畫面（等比例）
  if(R&&R.ok){ if(st.cam==='free') st.userCam=false; rebuild3D(); }
  syncStatic(); st.dirty=true;
}
function applyParams(defer){ setupParams(); if(defer!==true) layoutStage(); resetToPreview(); }   // 拖滑桿時先不改畫面高度（免得滑桿跑掉），放開手再調
function startLive(){                             // 起飛：還沒有任何炸彈，由你決定什麼時候投
  st.preview=false; st.live=true; st.taus=[]; REL=[]; st.dropping=false; st.t=0; st.tReach=0; st.run='running'; st.msg=''; st.snap=true;
  if(!st.follow){ st.zoom=st.zoomT=1; } st.follow=true; st.fit=false; st.vcT=null; st.off=0; syncZoomBtn();
  if(R&&R.ok){ if(st.cam==='free') st.userCam=false; rebuild3D(); }
  syncStatic(); st.dirty=true;
}
function replay(){
  if(!st.follow){ st.zoom=st.zoomT=1; } st.follow=true; st.fit=false; st.vcT=null; st.off=0; syncZoomBtn();
  st.preview=false; st.live=false; st.t=0; st.run='running'; st.msg=''; st.snap=true; syncButtons(); st.dirty=true;
}
function addDrop(tau){ st.taus.push(tau); REL.push(relOf(tau)); if(R&&R.ok) buildTrail(REL.length-1); }
function scheduleDrops(){                         // 投彈中：每隔 GAP 秒放一顆（用排定的時間，不受畫面幀率影響）
  while(st.dropping&&st.taus.length<NB&&st.t>=st.nextDrop-1e-9){ addDrop(st.nextDrop); st.nextDrop+=GAP; }
  if(st.taus.length>=NB) st.dropping=false;
}
function toggleDrop(){
  if(!(st.live&&st.run==='running')) return;
  if(st.dropping) st.dropping=false;
  else if(st.taus.length<NB){ st.dropping=true; st.nextDrop=st.t; scheduleDrops(); }
  syncButtons(); st.dirty=true;
}
function truncateAt(t){
  st.taus=st.taus.filter(x=>x<=t+1e-9); syncRel(); st.dropping=false; st.tReach=t;
}
const endView=()=>{ if(st.follow) fitAll(false); };   // 飛完了：自動切到全景看整體（你已經自己平移過就不動）
function checkFinish(){
  if(st.live){
    if(!st.taus.length){ if(st.t>=T_WAIT){ st.t=T_WAIT; st.run='finished'; st.live=false; st.msg='timeout'; syncButtons(); } }
    else if(!st.dropping&&st.t>=tEnd()){ st.t=tEnd(); st.run='finished'; st.live=false; syncButtons(); endView(); }
  } else if(st.t>=tEnd()){ st.t=tEnd(); st.run='finished'; syncButtons(); endView(); }
}
function advance(dt){
  st.t+=dt*st.speed; st.dirty=true;
  if(st.live){ st.tReach=Math.max(st.tReach,st.t); scheduleDrops(); }
  checkFinish();
}
function render(){
  updateReadouts();
  if(st.view==='ground') draw2D();
  else if(R&&R.ok) render3D();
}
let last=0;
function tick(ts){
  const dt=Math.min(.05,Math.max(0,(ts-last)/1000)||0); last=ts; frameDt=dt||.016;
  if(st.run==='running') advance(dt);
  if(st.view==='ground'&&updateView(dt)) st.dirty=true;
  if(st.dirty){ st.dirty=false; render(); }
  requestAnimationFrame(tick);
}

/* ============ 事件 ============ */
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
document.querySelectorAll('#camsw button').forEach(b=>b.addEventListener('click',()=>setCam(b.dataset.cam)));
document.querySelectorAll('input[name="mode"]').forEach(r=>r.addEventListener('change',()=>{ if(r.value===st.mode) return; st.mode=r.value; applyParams(); }));
$('play').addEventListener('click',()=>{
  if(st.preview){ startLive(); return; }
  if(st.run==='finished'){ if(!st.taus.length) startLive(); else replay(); return; }
  if(st.run==='running') st.run='paused';
  else { if(st.live&&st.t<st.tReach-1e-6) truncateAt(st.t); if(!st.live&&st.t>=tEnd()-1e-6) st.t=0; st.run='running'; }
  syncButtons(); st.dirty=true;
});
$('drop').addEventListener('click',toggleDrop);
$('reset').addEventListener('click',resetToPreview);
$('speed').addEventListener('click',()=>{ st.speed=st.speed===1?.5:(st.speed===.5?.25:1); $('speed').textContent=(st.speed===1?'1':String(st.speed))+'×'; });
$('scrub').addEventListener('input',e=>{ st.t=Math.min(scrubMax(),Math.max(0,+e.target.value)); if(st.run==='running') st.run='paused'; else if(st.run==='finished') st.run='paused'; st.snap=true; syncButtons(); st.dirty=true; });
$('optV').addEventListener('change',e=>{st.showV=e.target.checked;st.dirty=true;});
$('optB').addEventListener('change',e=>{st.showB=e.target.checked;st.dirty=true;});
$('optChick').addEventListener('change',e=>{st.chick=e.target.checked;syncStatic();st.dirty=true;});
$('aMag').addEventListener('input',e=>{ A_MAG=+e.target.value; applyParams(true); });
$('aMag').addEventListener('change',layoutStage);
$('alt').addEventListener('input',e=>{ ALT=+e.target.value; applyParams(true); });
$('alt').addEventListener('change',layoutStage);
$('nb').addEventListener('input',e=>{ NB=+e.target.value; applyParams(true); });
$('nb').addEventListener('change',layoutStage);
$('gap').addEventListener('input',e=>{ GAP=+e.target.value; applyParams(true); });
$('gap').addEventListener('change',layoutStage);

/* 地面視角：拖曳平移、滾輪／雙指縮放、＋－全景按鈕 */
(function(){
  const ptrs=new Map(); let pinchD=0;
  const hideHint=()=>{ $('hint').style.opacity='0'; };
  const end=e=>{ ptrs.delete(e.pointerId); pinchD=0; if(!ptrs.size) c2d.classList.remove('dragging'); };
  c2d.addEventListener('pointerdown',e=>{
    if(st.view!=='ground') return;
    try{ c2d.setPointerCapture(e.pointerId); }catch(_){}
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,mv:0});
    if(ptrs.size===2){ const [p,q]=[...ptrs.values()]; pinchD=Math.hypot(p.x-q.x,p.y-q.y); }
    c2d.classList.add('dragging');
  });
  c2d.addEventListener('pointermove',e=>{
    const p=ptrs.get(e.pointerId); if(!p) return;
    const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
    if(ptrs.size>=2){
      const [a,b]=[...ptrs.values()], d=Math.hypot(a.x-b.x,a.y-b.y);
      if(pinchD>8&&d>8){ const r=c2d.getBoundingClientRect(); zoomAt(d/pinchD,(a.x+b.x)/2-r.left); hideHint(); }
      pinchD=d; return;
    }
    p.mv+=Math.abs(dx)+Math.abs(dy); if(p.mv<5) return;
    st.fit=false; if(st.follow){ st.follow=false; st.vcT=null; syncZoomBtn(); }
    st.vc-=dx/st.vS; st.oy+=dy; hideHint(); st.dirty=true;
  });
  c2d.addEventListener('pointerup',end); c2d.addEventListener('pointercancel',end); c2d.addEventListener('lostpointercapture',end);
  c2d.addEventListener('wheel',e=>{
    if(st.view!=='ground') return; e.preventDefault();
    const r=c2d.getBoundingClientRect(), dy=e.deltaMode===1?e.deltaY*16:e.deltaY;
    zoomAt(Math.exp(-dy*(e.ctrlKey?.01:.0016)),e.clientX-r.left); hideHint();
  },{passive:false});
  $('zIn').addEventListener('click',()=>zoomBtn(1.5));
  $('zOut').addEventListener('click',()=>zoomBtn(1/1.5));
  $('zFit').addEventListener('click',()=>{ st.follow?fitAll():followOn(); });
})();

/* ============ 啟動 ============ */
setupParams(); readTokens(); resetToPreview();
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readTokens);
new MutationObserver(readTokens).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
new ResizeObserver(resize).observe(stage);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{st.dirty=true;});
if(window.matchMedia&&!matchMedia('(min-width: 900px)').matches) $('explain').open=false;
layoutStage(); syncStatic(); showHint(); resize();
requestAnimationFrame(tick);
})();
